name: agy-pr-review
services:
  fetcher:
    build:
      context: .
      dockerfile: docker/Dockerfile.fetcher
    profiles: [operator]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m,mode=1777]
    volumes:
      - ./config.json:/config/config.json:ro
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
  runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/user/1000:size=16m,uid=1000,gid=1000,mode=0700
      - /work:size=16m,uid=1000,gid=1000,mode=0700
    volumes:
      - agy_home:/home/reviewer
      - ./docker/agy-settings.json:/home/reviewer/.gemini/antigravity-cli/settings.json:ro
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    # No host socket, GitHub token, report token, PR filesystem, or public port.
  reports:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: docker/Dockerfile.reports
    profiles: [reports]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,mode=1777]
    volumes:
      - ./state/reports:/reports:ro
    secrets: [report_token]
    environment:
      REPORT_ALLOWED_HOSTS: ${REPORT_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
    ports:
      - 127.0.0.1:8080:8080
    pids_limit: 32
    mem_limit: 256m
    cpus: 1
secrets:
  report_token:
    file: ./secrets/report_token
volumes:
  agy_home:
